name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run sample pipeline
        run: python src/main.py --config config.yaml
      - name: Build Docker image
        run: docker build -t hypergamy-engagement .
      - name: Run Docker sample
        run: |
          mkdir -p results
          docker run --rm -v "$PWD/results:/app/results" hypergamy-engagement
      - name: Verify generated outputs
        run: |
          test -s results/results.json
          test -s results/run_log.txt
